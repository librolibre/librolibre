<app-header />
<main class="contenedor">
  <!-- Aviso de cuenta suspendida - Laurence -->
  @if (suspended) {
    <p class="notice" role="alert">Tu cuenta está suspendida y no puedes entrar.</p>
  }

  <section class="banner">
    <div class="banner-contenido">
      <h1>LibroLibre</h1>
      <div class="banner-sub">
        <p>Lee más, gasta menos.</p>
        <button type="button">Ver libros</button>
      </div>
    </div>
  </section>

  <section class="destacados">
    <h2>Nuestra mejor elección</h2>
    <div class="tarjetas">
      @if (cargando()) {
        <p>Cargando libros...</p>
      } @else {
        @for (libro of libros(); track libro.id) {
          <app-libro-card [libro]="libro" />
        } @empty {
          <p>No hay libros disponibles todavía.</p>
        }
      }
    </div>

    <div class="ver-mas-contenedor">
      <button type="button" class="btn-ver-mas">Ver más</button>
    </div>
  </section>

  <section class="generos">
    <h2>Filtra por género</h2>
    <div class="generos-grid">
      <button type="button" class="genero-card verde grande">Narrativa</button>
      <button type="button" class="genero-card naranja peque">Terror</button>
      <button type="button" class="genero-card naranja peque">Lírica</button>
      <button type="button" class="genero-card verde grande">Dramática</button>
    </div>
  </section>
</main>
<app-footer />
