<article class="tarjeta">
  <div class="portada">
    @if (libro().portada && !portadaRota()) {
      <img [src]="libro().portada" [alt]="libro().titulo" (error)="portadaRota.set(true)" />
    }
  </div>
  <div class="info">
    <p class="titulo">{{ libro().titulo }}</p>
    <small>{{ libro().genero }}</small>
  </div>
</article>
